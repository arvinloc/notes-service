<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
</head>
<body>

<header class="bg-dark text-white p-3 text-center mb-4">
  <div class="d-flex justify-content-between align-items-center">
    <h1 class="mb-0">Заметки</h1>
    <a href="/api/logout" class="btn btn-outline-light">Выйти</a>
  </div>

</header>
<div class="note-input-container bg-light p-4 rounded shadow-sm mb-5">
  <input type="text" id="note-title-input" class="form-control" placeholder="Введите заголовок..." />
  <textarea id="note-desc-input" class="form-control" rows="4" placeholder="Введите описание..."></textarea>
  <button id="add-note-btn" class="btn btn-primary float-end">Добавить заметку</button>
</div>

<div id="notes-list" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
  <!-- Сюда будут добавляться карточки -->
</div>

<script type="module" src="/static/script.js"></script>


</body>
</html>
